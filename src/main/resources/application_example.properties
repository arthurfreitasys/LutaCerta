# Renomeie este arquivo para "application.properties" e preencha com seus dados reais.
# O application.properties real NÃO deve ser commitado (deve estar no .gitignore).

spring.application.name=gestao-UFC
# Conexão com o banco PostgreSQL (Supabase)
spring.datasource.url=jdbc:postgresql://
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Paginação padrão
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# Nota: se estiver usando Supabase, prefira o modo Session Pooler (porta 6543)
# em redes sem suporte a IPv6 - a conexao direta (porta 5432) exige IPv6 e pode
# falhar com UnknownHostException em alguns provedores.
